name: FinSight AI CI

on:
  push:
    branches: [main]
    paths:
      - "finsight/**"
      - "tests/**"
      - "requirements-ci.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Offline Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Validate Python syntax
        run: python -m compileall -q finsight tests

      - name: Run offline unit tests
        run: python -m pytest tests/ --ignore=tests/test_sec_live.py -q
